<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Same policy as the desktop shell, plus remote/https images so notes that
         reference hosted pictures still render on a published site. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:"
    />
    <link rel="icon" href="./favicons/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" href="./favicons/favicon-192x192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./favicons/apple-touch-icon.png" />
    <title>ZN Story Line</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- snapshot.js (the story data) is injected into <head> by vite.web.config.ts. -->
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
