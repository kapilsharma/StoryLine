name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Reads release-please-config.json + .release-please-manifest.json.
      # On merges to main it opens/updates a release PR; merging that PR
      # bumps the version, updates CHANGELOG.md, tags and creates a Release.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # release-please names the Release "v{version}"; rename it to the bare tag.
      - name: Strip 'v' from the release title
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.release.outputs.tag_name }}" --title "${{ steps.release.outputs.tag_name }}"
